<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>南島文化節｜手機列印</title><style>*{box-sizing:border-box}body{font-family:system-ui,"Microsoft JhengHei";background:#f4f0e7;color:#292720;margin:0;padding:18px}.wrap{max-width:680px;margin:auto}.card{background:#fff;border:1px solid #ddd4c7;border-radius:18px;padding:18px;margin:14px 0}h1{text-align:center}.food{background:#eee8dd;border:1px solid #d6cdbc;color:#222;border-radius:12px;padding:13px;margin:5px;font-size:16px}.food.on{background:#506851;color:#fff}.print{width:100%;background:#506851;color:#fff;border:0;border-radius:14px;padding:17px;font-size:20px;font-weight:700}.clear{background:#ddd5c8;border:0;border-radius:10px;padding:10px 14px}.status{padding:12px;border-radius:10px;background:#f5f5f5;margin-top:10px}.small{font-size:13px;color:#706b62;line-height:1.6}</style></head><body><div class="wrap"><h1>南島文化節｜慢活菜單</h1><div class="card"><b>料理累積</b><div id="foods"></div><p id="count">目前 0 道</p><button class="clear" onclick="clearAll()">清空</button></div><div class="card"><button class="print" onclick="sendPrint()">🖨️ 完成・送到 T4e+ 列印</button><div id="status" class="status">尚未送出列印工作</div><p class="small">手機按下後，正式版會把工作送到雲端佇列；Windows 列印橋接器收到後只送到 Sbarco T4e+ 203 dpi。</p></div></div><script>const recipes=[['FOOD001','小米'],['FOOD002','樹豆'],['FOOD003','紅藜'],['FOOD004','刺蔥'],['FOOD005','南瓜']];let selected=[];const foods=document.getElementById('foods');recipes.forEach(([id,n])=>{let b=document.createElement('button');b.className='food';b.textContent=n;b.dataset.id=id;b.onclick=()=>toggle(b);foods.appendChild(b)});function toggle(b){let id=b.dataset.id,i=selected.indexOf(id);if(i>=0){selected.splice(i,1);b.classList.remove('on')}else{selected.push(id);b.classList.add('on')}document.getElementById('count').textContent=`目前 ${selected.length} 道`;}function clearAll(){selected=[];document.querySelectorAll('.food').forEach(x=>x.classList.remove('on'));document.getElementById('count').textContent='目前 0 道'}async function sendPrint(){if(!selected.length){alert('請先加入料理');return}const job={id:crypto.randomUUID(),createdAt:new Date().toISOString(),printer:'Sbarco T4e+ 203 dpi',paper:{widthMm:70,heightMm:50,gapMm:3},recipes:[...selected],status:'queued'};localStorage.setItem('lastT4eJob',JSON.stringify(job));document.getElementById('status').innerHTML=`✓ 手機端列印工作已建立<br>工作編號：${job.id.slice(0,8)}<br><b>下一步：</b>接上雲端佇列後即可由 Windows 自動收到並列印。`;}</script></body></html>
