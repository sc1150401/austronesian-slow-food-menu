<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>南島文化節｜手機列印</title><style>*{box-sizing:border-box}body{font-family:system-ui,"Microsoft JhengHei";background:#f4f0e7;color:#292720;margin:0;padding:18px}.wrap{max-width:680px;margin:auto}.card{background:#fff;border:1px solid #ddd4c7;border-radius:18px;padding:18px;margin:14px 0}h1{text-align:center}.food{background:#eee8dd;border:1px solid #d6cdbc;color:#222;border-radius:12px;padding:13px;margin:5px;font-size:16px}.food.on{background:#506851;color:#fff}.print{width:100%;background:#506851;color:#fff;border:0;border-radius:14px;padding:17px;font-size:20px;font-weight:700}.print:disabled{opacity:.55}.clear{background:#ddd5c8;border:0;border-radius:10px;padding:10px 14px}.status{padding:12px;border-radius:10px;background:#f5f5f5;margin-top:10px}.ok{background:#e9f4ea}.err{background:#fdeaea}.small{font-size:13px;color:#706b62;line-height:1.6}</style></head><body><div class="wrap"><h1>南島文化節｜慢活菜單</h1><div class="card"><b>料理累積</b><div id="foods"></div><p id="count">目前 0 道</p><button class="clear" onclick="clearAll()">清空</button></div><div class="card"><button id="printBtn" class="print" onclick="sendPrint()">🖨️ 完成・送到 T4e+ 列印</button><div id="status" class="status">☁️ Firebase 已連接，等待送印</div><p class="small">目前測試紙張：70 × 50 mm｜Gap 3 mm。手機送出的工作會寫入 Firestore 的 printJobs 佇列；下一步由 Windows Bridge 讀取並指定 Sbarco T4e+ 203 dpi。</p></div></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getFirestore,collection,addDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';const firebaseConfig={apiKey:'AIzaSyACxi64o1jGe8DOQQBFofrqjed2Q1xjy-M',authDomain:'south-island-1a501.firebaseapp.com',projectId:'south-island-1a501',storageBucket:'south-island-1a501.firebasestorage.app',messagingSenderId:'1072047645942',appId:'1:1072047645942:web:4628fd2aea9b344eebf8d7',measurementId:'G-5Z7W76CBDE'};const app=initializeApp(firebaseConfig),db=getFirestore(app);const recipes=[['FOOD001','小米'],['FOOD002','樹豆'],['FOOD003','紅藜'],['FOOD004','刺蔥'],['FOOD005','南瓜']];let selected=[];const foods=document.getElementById('foods'),status=document.getElementById('status'),btn=document.getElementById('printBtn');recipes.forEach(([id,n])=>{let b=document.createElement('button');b.className='food';b.textContent=n;b.dataset.id=id;b.onclick=()=>toggle(b);foods.appendChild(b)});function toggle(b){let id=b.dataset.id,i=selected.indexOf(id);if(i>=0){selected.splice(i,1);b.classList.remove('on')}else{selected.push(id);b.classList.add('on')}document.getElementById('count').textContent=`目前 ${selected.length} 道`}window.clearAll=()=>{selected=[];document.querySelectorAll('.food').forEach(x=>x.classList.remove('on'));document.getElementById('count').textContent='目前 0 道'};window.sendPrint=async()=>{if(!selected.length){alert('請先加入料理');return}btn.disabled=true;status.className='status';status.textContent='☁️ 正在送出列印工作…';try{const doc=await addDoc(collection(db,'printJobs'),{createdAt:serverTimestamp(),createdAtClient:new Date().toISOString(),printer:'Sbarco T4e+ 203 dpi',paper:{widthMm:70,heightMm:50,gapMm:3},recipes:[...selected],status:'queued',source:'phone-web'});status.className='status ok';status.innerHTML=`✓ 已送到雲端列印佇列<br>工作編號：<b>${doc.id.slice(0,8)}</b><br>狀態：等待 T4e+ 電腦接收`;localStorage.setItem('lastT4eJobId',doc.id)}catch(e){console.error(e);status.className='status err';status.innerHTML=`✕ 送出失敗<br>${e.code||e.message}<br>請確認 Firestore 測試模式仍允許寫入。`}finally{btn.disabled=false}};</script></body></html>
