<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>南島文化節｜慢活菜單</title><style>body{font-family:system-ui,"Microsoft JhengHei";max-width:760px;margin:auto;padding:20px;background:#f4f0e7;color:#292720}.card{background:#fff;border:1px solid #ddd5c8;border-radius:16px;padding:18px;margin:14px 0}h1{text-align:center}button{padding:12px 15px;border:0;border-radius:10px;margin:4px;background:#506851;color:#fff;font-size:16px}.secondary{background:#e7e2d8;color:#222}.hidden{display:none}.chip{display:inline-block;border:1px solid #ddd;padding:6px 10px;border-radius:20px;margin:4px}canvas{width:100%;height:auto;background:white;border:1px solid #ddd}input{padding:12px;width:100%;box-sizing:border-box;font-size:16px}.small{color:#746f65;font-size:13px;line-height:1.5}</style></head><body><h1>南島文化節｜慢活菜單</h1><p style="text-align:center">Phomemo M04S｜80mm 非黏性連續熱感紙</p><div class="card"><button id="staff">⚙ 工作人員設定</button><button id="print">🖨️ 直接列印</button><div id="chips">尚未加入料理</div><p id="msg">目前為 M04S 80mm 實機測試版。</p></div><div class="card"><b>模擬掃描食材</b><div><button class="secondary food" data-c="FOOD001">小米</button><button class="secondary food" data-c="FOOD002">樹豆</button><button class="secondary food" data-c="FOOD003">紅藜</button><button class="secondary food" data-c="FOOD004">刺蔥</button><button class="secondary food" data-c="FOOD005">南瓜</button></div></div><div class="card"><b>80mm 動態紙本預覽</b><p class="small">料理越多，紙張自動延長；正式列印底部會保留電子菜單 QR 區。</p><canvas id="cv" width="944" height="650"></canvas></div><div id="login" class="card hidden"><h2>🔒 工作人員驗證</h2><input id="pw" type="password" placeholder="輸入密碼"><button id="go">登入</button><button id="cancel" class="secondary">取消</button></div><div id="panel" class="card hidden"><h2>工作人員設定</h2><p id="btstate">M04S：尚未連線</p><button id="connect">連接／重新連接 M04S</button><button id="test" class="secondary">測試列印</button><button id="clear" class="secondary">清空目前菜單</button><button id="lock" class="secondary">🔒 鎖定並關閉</button><p class="small">鎖定只隱藏設定區，不主動中斷藍牙。</p></div><script>const PW='2026',R={FOOD001:['小米','小米南瓜粥'],FOOD002:['樹豆','樹豆排骨湯'],FOOD003:['紅藜','紅藜野菜炊飯'],FOOD004:['刺蔥','刺蔥煎蛋'],FOOD005:['南瓜','香甜南瓜濃湯']};let sel=[],dev=null,chr=null,last=Date.now();const $=x=>document.getElementById(x);function draw(){let c=$('cv');c.height=sel.length?330+sel.length*300:650;let x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#000';x.textAlign='center';x.textBaseline='top';x.font='bold 58px sans-serif';x.fillText('南島文化節｜慢活菜單',472,35);x.beginPath();x.moveTo(45,120);x.lineTo(899,120);x.stroke();if(!sel.length){x.font='30px sans-serif';x.fillText('掃描食材後顯示菜單',472,180);return}let y=155;sel.forEach((c,i)=>{x.textAlign='left';x.font='bold 42px sans-serif';x.fillText((i+1)+'. '+R[c][0]+'｜'+R[c][1],55,y);x.font='28px sans-serif';x.fillText('料理內容將於正式資料匯入後顯示於此。',55,y+70);x.fillText('食材、料理步驟與介紹可依正式內容自動排版。',55,y+115);x.beginPath();x.moveTo(55,y+205);x.lineTo(889,y+205);x.stroke();y+=300});x.textAlign='center';x.font='28px sans-serif';x.fillText('電子彩色菜單 QR',472,c.height-110)}function chips(){$('chips').innerHTML=sel.length?sel.map(c=>'<span class="chip">'+R[c][0]+'｜'+R[c][1]+'</span>').join(''):'尚未加入料理'}function add(c){last=Date.now();if(!sel.includes(c)){sel.push(c);chips();draw();$('msg').textContent='已加入 '+R[c][0]+'，目前 '+sel.length+' 道。'}}document.querySelectorAll('.food').forEach(b=>b.onclick=()=>add(b.dataset.c));$('staff').onclick=()=>{$('login').classList.remove('hidden');$('pw').value=''};$('cancel').onclick=()=>$('login').classList.add('hidden');$('go').onclick=()=>{if($('pw').value===PW){$('login').classList.add('hidden');$('panel').classList.remove('hidden')}else alert('密碼錯誤')};$('lock').onclick=()=>$('panel').classList.add('hidden');$('clear').onclick=()=>{sel=[];chips();draw()};$('connect').onclick=async()=>{try{if(!navigator.bluetooth)throw Error('請使用支援 Web Bluetooth 的 Android Chrome');dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[0xff00,0xffe0,0xae30]});let s=await dev.gatt.connect();let services=await s.getPrimaryServices();for(const service of services){let cs=await service.getCharacteristics();chr=cs.find(c=>c.properties.write||c.properties.writeWithoutResponse);if(chr)break}if(!chr)throw Error('找不到可寫入的 BLE characteristic');$('btstate').textContent='✓ 已連線：'+(dev.name||'M04S')}catch(e){$('btstate').textContent='連線失敗：'+e.message}};$('test').onclick=()=>alert(chr?'M04S 已連線。下一步進行實機列印封包校正。':'請先連接 M04S。');$('print').onclick=()=>{$('msg').textContent=chr?'已準備 M04S 80mm 列印；實機到手後校正正式列印封包。':'請先由工作人員連接 M04S。'};setInterval(()=>{if(sel.length&&Date.now()-last>60000){sel=[];chips();draw();$('msg').textContent='60 秒未操作，已自動清空。'}},5000);draw();</script></body></html>
