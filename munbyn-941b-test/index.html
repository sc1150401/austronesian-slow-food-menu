<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>MUNBYN ITPP941B｜Web Bluetooth 測試</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#f4f4f4}
    *{box-sizing:border-box}
    body{margin:0;padding:20px}
    .wrap{max-width:720px;margin:auto}
    .card{background:#fff;border-radius:18px;padding:18px;margin:0 0 14px;box-shadow:0 3px 16px rgba(0,0,0,.07)}
    h1{font-size:24px;margin:0 0 8px} h2{font-size:18px;margin:0 0 12px}
    p{line-height:1.55;margin:8px 0;color:#444}
    .status{padding:12px;border-radius:12px;background:#f0f0f0;font-weight:700;white-space:pre-wrap}
    button{width:100%;border:0;border-radius:14px;padding:15px 16px;margin-top:10px;font-size:17px;font-weight:800;cursor:pointer;background:#111;color:#fff}
    button.secondary{background:#e9e9e9;color:#111}
    button:disabled{opacity:.45;cursor:not-allowed}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px;color:#555}
    input,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:16px;background:#fff}
    pre{overflow:auto;background:#111;color:#eee;padding:12px;border-radius:12px;min-height:150px;font-size:12px;line-height:1.45}
    .ok{color:#087d3e}.warn{color:#9a5b00}.bad{color:#b42318}
    .small{font-size:12px;color:#777}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>MUNBYN ITPP941B Web Bluetooth 測試</h1>
    <p>用途：先驗證「Android Chrome 網頁 → Bluetooth → 印表機」是否能直接建立連線並送出 TSPL 測試列印。</p>
    <div id="support" class="status">檢查瀏覽器中…</div>
  </div>

  <div class="card">
    <h2>1. 連線印表機</h2>
    <button id="connectBtn">搜尋並連線 Bluetooth 印表機</button>
    <button id="disconnectBtn" class="secondary" disabled>中斷連線</button>
    <div id="connection" class="status" style="margin-top:12px">尚未連線</div>
  </div>

  <div class="card">
    <h2>2. 測試紙張</h2>
    <div class="grid">
      <div>
        <label for="width">紙寬</label>
        <select id="width">
          <option value="70">70 mm</option>
          <option value="80" selected>80 mm</option>
          <option value="100">100 mm</option>
          <option value="108">108 mm</option>
        </select>
      </div>
      <div>
        <label for="height">測試長度</label>
        <input id="height" type="number" min="30" max="300" value="60" />
      </div>
    </div>
    <label for="media">紙張模式</label>
    <select id="media">
      <option value="continuous" selected>Continuous 非黏性連續紙</option>
      <option value="gap">Gap 標籤紙（預設 3mm 間隙）</option>
    </select>
    <button id="printBtn" disabled>送出 TSPL 測試列印</button>
    <p class="small">測試內容只使用英文與 QR Code，先排除中文字型造成的變數。正式版會改成 Canvas 點陣圖，因此中文排版不依賴印表機內建字型。</p>
  </div>

  <div class="card">
    <h2>偵測紀錄</h2>
    <pre id="log"></pre>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const support = $('support');
  const connection = $('connection');
  const connectBtn = $('connectBtn');
  const disconnectBtn = $('disconnectBtn');
  const printBtn = $('printBtn');
  const logEl = $('log');

  let device = null;
  let server = null;
  let writeChar = null;

  // 常見 BLE serial / printer service UUID。
  // ITPP941B 實機到手後，頁面會逐一嘗試並記錄可寫入 characteristic。
  const services = [
    '0000ffe0-0000-1000-8000-00805f9b34fb',
    '0000ff00-0000-1000-8000-00805f9b34fb',
    '0000fff0-0000-1000-8000-00805f9b34fb',
    '0000ae30-0000-1000-8000-00805f9b34fb',
    '000018f0-0000-1000-8000-00805f9b34fb',
    '6e400001-b5a3-f393-e0a9-e50e24dcca9e',
    '49535343-fe7d-4ae5-8fa9-9fafd205e455'
  ];

  function log(msg){
    const t = new Date().toLocaleTimeString();
    logEl.textContent += `[${t}] ${msg}\n`;
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setDisconnected(msg='尚未連線'){
    writeChar = null;
    server = null;
    connection.textContent = msg;
    printBtn.disabled = true;
    disconnectBtn.disabled = true;
  }

  if (!navigator.bluetooth) {
    support.innerHTML = '<span class="bad">✕ 此瀏覽器沒有 Web Bluetooth。</span>\n請用 Android 的 Chrome 測試。';
    connectBtn.disabled = true;
  } else {
    support.innerHTML = '<span class="ok">✓ 瀏覽器支援 Web Bluetooth</span>\n下一步可搜尋 ITPP941B / MUNBYN Bluetooth 裝置。';
  }

  async function discoverWritableCharacteristic(){
    for (const serviceUuid of services) {
      try {
        const svc = await server.getPrimaryService(serviceUuid);
        log(`找到 Service: ${svc.uuid}`);
        const chars = await svc.getCharacteristics();
        for (const ch of chars) {
          const p = ch.properties;
          log(`  Characteristic: ${ch.uuid} | write=${p.write} writeWithoutResponse=${p.writeWithoutResponse} notify=${p.notify}`);
          if (!writeChar && (p.writeWithoutResponse || p.write)) {
            writeChar = ch;
            log(`✓ 選定可寫入 Characteristic: ${ch.uuid}`);
          }
        }
      } catch (e) {
        // 該 service 不存在是正常狀況，不逐項顯示錯誤。
      }
    }
    return writeChar;
  }

  async function connect(){
    log('開啟 Bluetooth 裝置選擇器…');
    connection.textContent = '等待選擇裝置…';
    try {
      device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: services
      });
      log(`已選擇裝置: ${device.name || '(無名稱)'}`);
      device.addEventListener('gattserverdisconnected', () => {
        log('Bluetooth 已中斷');
        setDisconnected('Bluetooth 已中斷');
      });

      connection.textContent = `連線中：${device.name || 'Bluetooth device'}`;
      server = await device.gatt.connect();
      log('GATT 已連線');

      await discoverWritableCharacteristic();
      if (!writeChar) {
        connection.innerHTML = `已連線：${device.name || 'Bluetooth device'}\n但目前候選 UUID 尚未找到可寫入通道。`;
        log('⚠ 已連線，但尚未找到可寫入 characteristic。實機結果可用來補上 MUNBYN 的實際 UUID。');
        disconnectBtn.disabled = false;
        return;
      }

      connection.innerHTML = `✓ 已連線：${device.name || 'Bluetooth device'}\n✓ 已找到可寫入通道`;
      printBtn.disabled = false;
      disconnectBtn.disabled = false;
    } catch (e) {
      log(`連線失敗/取消：${e.name}: ${e.message}`);
      setDisconnected('連線未完成');
    }
  }

  async function writeBytes(bytes){
    if (!writeChar) throw new Error('尚未找到可寫入 Bluetooth characteristic');
    const chunkSize = 180;
    for (let i=0;i<bytes.length;i+=chunkSize){
      const chunk = bytes.slice(i, i + chunkSize);
      if (writeChar.properties.writeWithoutResponse && writeChar.writeValueWithoutResponse) {
        await writeChar.writeValueWithoutResponse(chunk);
      } else {
        await writeChar.writeValue(chunk);
      }
      await new Promise(r => setTimeout(r, 18));
    }
  }

  async function printTest(){
    const w = Math.max(20, Math.min(108, Number($('width').value) || 80));
    const h = Math.max(30, Math.min(300, Number($('height').value) || 60));
    const media = $('media').value;
    const mediaCmd = media === 'gap' ? 'GAP 3 mm,0 mm\r\n' : 'GAP 0 mm,0 mm\r\n';

    // ASCII-only TSPL test. Formal menu will be rendered as raster bitmap.
    const tspl =
      `SIZE ${w} mm,${h} mm\r\n` +
      mediaCmd +
      'DIRECTION 1\r\n' +
      'REFERENCE 0,0\r\n' +
      'CLS\r\n' +
      'TEXT 32,28,"0",0,2,2,"SLOW FOOD MENU"\r\n' +
      'TEXT 32,82,"0",0,1,1,"MUNBYN ITPP941B WEB BLUETOOTH"\r\n' +
      `TEXT 32,116,"0",0,1,1,"PAPER ${w} x ${h} mm"\r\n` +
      'QRCODE 32,160,L,5,A,0,"FOOD001"\r\n' +
      'PRINT 1,1\r\n';

    log('準備送出 TSPL：');
    log(tspl.replace(/\r\n/g, ' | '));
    printBtn.disabled = true;
    try {
      const bytes = new TextEncoder().encode(tspl);
      await writeBytes(bytes);
      log(`✓ 已送出 ${bytes.length} bytes`);
      connection.textContent = '✓ 測試資料已送出，請確認印表機是否出紙';
    } catch (e) {
      log(`✕ 列印失敗：${e.name}: ${e.message}`);
      connection.textContent = '列印資料送出失敗';
    } finally {
      if (writeChar) printBtn.disabled = false;
    }
  }

  connectBtn.addEventListener('click', connect);
  disconnectBtn.addEventListener('click', () => {
    if (device?.gatt?.connected) device.gatt.disconnect();
    setDisconnected();
    log('已手動中斷');
  });
  printBtn.addEventListener('click', printTest);
})();
</script>
</body>
</html>
